apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
spec:
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      zipkin:
        endpoint: http://host.minikube.internal:9411/api/v2/spans

      debug: {}

      prometheus:
        endpoint: "0.0.0.0:8889"
        const_labels:
          label1: muffin-wallet

      otlphttp/logs:
        endpoint: "http://host.minikube.internal:3100/otlp"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [zipkin]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/logs]
      telemetry:
        logs:
          level: "debug"
